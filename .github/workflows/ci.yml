name: exact-bound-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: English-only proof tree
        run: python scripts/check_english_only.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild deterministic tables
        run: python scripts/generate_bounds.py --max-n 50 --output-dir /tmp/chow-bounds
