name: exact-bound-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: English-only proof tree
        run: python scripts/check_english_only.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild deterministic general bounds
        run: python scripts/generate_bounds.py --max-n 50 --output-dir /tmp/chow-bounds
      - name: Rebuild all-degree multishadow certificates
        run: |
          python scripts/generate_multishadow_bounds.py \
            --csv /tmp/multishadow_bounds.csv \
            --json /tmp/multishadow_bounds.json
      - name: Replay parity-asymptotic diagnostics
        run: |
          python scripts/generate_multishadow_asymptotic_diagnostics.py \
            --json /tmp/multishadow_asymptotic_diagnostics.json
      - name: Rebuild even-degree multishadow certificates
        run: |
          python scripts/generate_even_multishadow_bounds.py \
            --csv /tmp/even_multishadow_bounds.csv \
            --json /tmp/even_multishadow_bounds.json
      - name: Replay n6 coordinate secant audit
        run: |
          python scripts/n6_coordinate_secant_audit.py \
            --json /tmp/n6_coordinate_secant_audit.json
      - name: Replay n6 one-step route barrier
        run: |
          python scripts/n6_multishadow_route_barrier.py \
            --json /tmp/n6_multishadow_route_barrier.json
      - name: Replay n6 quotient Koszul gain
        run: |
          python scripts/n6_quotient_gain_audit.py \
            --json /tmp/n6_quotient_gain_audit.json
      - name: Replay n6 coordinate-monomial full gain
        run: |
          python scripts/n6_coordinate_monomial_full_gain_audit.py \
            --json /tmp/n6_coordinate_monomial_full_gain.json
      - name: Replay n6 fixed-four coupled frontier
        run: |
          python scripts/n6_fixed_four_coupled_frontier.py \
            --json /tmp/n6_fixed_four_coupled_frontier.json
      - name: Replay n6 extremal six-plane classification
        run: |
          python scripts/n6_extremal_six_plane_audit.py \
            --json /tmp/n6_extremal_six_plane.json
      - name: Replay n6 b24 three-relation diagnostic
        run: |
          python scripts/n6_b24_three_relation_frontier.py \
            --json /tmp/n6_b24_three_relation_frontier.json
      - name: Replay n6 component-prolongation exclusion
        run: |
          python scripts/n6_component_prolongation_exclusion.py \
            --json /tmp/n6_component_prolongation_exclusion.json
      - name: Replay n6 lower25 fixed-q diagnostic
        run: |
          python scripts/n6_lower25_fixed_q_diagnostic.py \
            --json /tmp/n6_lower25_fixed_q_diagnostic.json
