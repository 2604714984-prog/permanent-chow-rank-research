[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permanent-chow-rank-research"
version = "0.1.0"
description = "Exact arithmetic research tools for Chow-rank lower bounds of permanent polynomials"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "numpy==2.4.6",
    "sympy==1.14.0",
]
replay = [
    "numpy==2.4.6",
    "python-flint==0.8.0",
    "sympy==1.14.0",
]
gpu = [
    "cupy-cuda13x[ctk]==14.1.1",
    "numpy==2.4.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
