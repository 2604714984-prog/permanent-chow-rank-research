[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permanent-chow-rank-research"
version = "0.1.0"
description = "Exact arithmetic research tools for Chow-rank lower bounds of permanent polynomials"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
